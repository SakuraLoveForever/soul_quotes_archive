<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080e17">
  <title>心灵鸡汤 · Soul Quotes Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --sidebar-w: 272px;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      --font-quote: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
      --font-mono: ui-monospace, "Cascadia Code", Consolas, "SFMono-Regular", monospace;

      color-scheme: dark;
      --bg: #080e17;
      --bg-image:
        radial-gradient(1100px 620px at 6% -12%, rgba(86, 160, 224, .20), transparent 62%),
        radial-gradient(900px 520px at 94% -10%, rgba(126, 200, 227, .12), transparent 55%),
        linear-gradient(180deg, #0b1420 0%, #070c14 100%);
      --surface: #0f1926;
      --surface-soft: #0c1520;
      --surface-hover: #13202f;
      --topbar-bg: rgba(9, 15, 24, .82);
      --sidebar-bg: rgba(9, 16, 26, .82);
      --border: #1d2c3f;
      --border-strong: #2b4059;
      --text: #e2ecf7;
      --text-muted: #96adc6;
      --text-subtle: #6b8199;
      --accent: #7ec8e3;
      --accent-strong: #a8d8ea;
      --accent-soft: rgba(126, 200, 227, .10);
      --accent-line: rgba(126, 200, 227, .38);
      --danger: #ff8f8f;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
      --shadow-md: 0 8px 26px rgba(0, 0, 0, .45);
      --shadow-lg: 0 20px 56px rgba(0, 0, 0, .55);
    }

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-ui);
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      background-color: var(--bg);
      background-image: var(--bg-image);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    body.no-scroll { overflow: hidden; }

    ::selection { background: rgba(126, 200, 227, .28); }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    body::-webkit-scrollbar, .toc::-webkit-scrollbar { width: 10px; height: 10px; }
    body::-webkit-scrollbar-thumb, .toc::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border: 3px solid transparent;
      border-radius: 999px;
      background-clip: content-box;
    }
    body::-webkit-scrollbar-track, .toc::-webkit-scrollbar-track { background: transparent; }

    /* ===== 侧边目录 ===== */
    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      padding: 20px 14px 14px;
      background: var(--sidebar-bg);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      backdrop-filter: blur(18px) saturate(150%);
      border-right: 1px solid var(--border);
      z-index: 60;
      transition: transform .25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 8px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .brand-mark {
      flex: none;
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border-radius: 12px;
      font-family: var(--font-quote);
      font-size: 1.05rem;
      font-weight: 700;
      color: #06202f;
      background: linear-gradient(140deg, #a8d8ea 0%, #6fb6dd 55%, #4a90d9 100%);
      box-shadow: 0 6px 16px rgba(74, 144, 217, .32);
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
    .brand-text strong { font-family: var(--font-quote); font-size: 1.02rem; letter-spacing: .04em; }
    .brand-text small { font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; color: var(--text-subtle); }

    .sidebar-tools { display: flex; gap: 6px; margin-bottom: 12px; }
    .tool-btn {
      flex: 1;
      padding: 7px 8px;
      font: inherit;
      font-size: .76rem;
      color: var(--text-muted);
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: color .15s ease, background-color .15s ease, border-color .15s ease;
    }
    .tool-btn:hover { color: var(--accent-strong); border-color: var(--accent-line); background: var(--accent-soft); }

    .toc { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-right: 2px; }
    .toc-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: .875rem;
      line-height: 1.35;
      transition: background-color .15s ease, color .15s ease;
    }
    .toc-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toc-item:hover { background: var(--surface-hover); color: var(--text); }
    .toc-item.active {
      background: var(--accent-soft);
      border-color: var(--accent-line);
      color: var(--accent-strong);
      font-weight: 600;
    }
    .toc-count {
      flex: none;
      min-width: 22px;
      padding: 1px 6px;
      text-align: center;
      border-radius: 999px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--text-subtle);
      font-size: .68rem;
      font-variant-numeric: tabular-nums;
    }
    .toc-item.active .toc-count { background: rgba(126, 200, 227, .16); border-color: transparent; color: inherit; }
    .toc-empty { padding: 16px; text-align: center; color: var(--text-subtle); font-size: .85rem; }

    /* ===== 主区域 ===== */
    .main { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px clamp(16px, 4vw, 36px);
      background: var(--topbar-bg);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      backdrop-filter: blur(14px) saturate(150%);
      border-bottom: 1px solid var(--border);
    }

    .menu-btn {
      display: none;
      place-items: center;
      width: 34px; height: 34px;
      flex: none;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
    }

    .topbar-title { display: none; font-family: var(--font-quote); font-weight: 700; letter-spacing: .04em; }

    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: .8rem;
      text-decoration: none;
      transition: color .15s ease, border-color .15s ease, background-color .15s ease, transform .15s ease;
    }
    .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--chip-color, var(--accent)); }
    .chip:hover { color: var(--text); border-color: var(--chip-color, var(--accent)); background: var(--surface-hover); transform: translateY(-1px); }
    .chip-xhs { --chip-color: #ff4757; }
    .chip-gh { --chip-color: #c9d1d9; }
    .chip-bili { --chip-color: #00a1d6; }

    .page { width: 100%; max-width: 940px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 36px) 72px; }

    .hero {
      position: relative;
      padding: 14px 0 16px;
    }
    .hero-body { min-width: 0; padding-right: 140px; }
    .hero-art { position: absolute; top: 14px; right: 0; width: 116px; pointer-events: none; user-select: none; filter: drop-shadow(0 14px 30px rgba(126, 200, 227, .16)); }
    .hero-art img { display: block; width: 100%; height: auto; }
    .hero-kicker {
      margin: 0 0 4px;
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .hero h1 {
      margin: 0 0 6px;
      font-family: var(--font-quote);
      font-size: clamp(1.65rem, 2.4vw, 2.1rem);
      line-height: 1.15;
      letter-spacing: .02em;
      background: linear-gradient(115deg, var(--text) 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero-sub { margin: 0 0 6px; font-family: var(--font-quote); font-size: .88rem; color: var(--text-muted); }

    .stats { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .85rem; color: var(--text-muted); }
    .stat strong { color: var(--accent-strong); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
    .stat-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--border-strong); }

    .hero-tip { display: flex; align-items: center; gap: 6px; margin: 8px 0 0; font-size: .74rem; color: var(--text-subtle); }
    .hero-tip span { color: var(--accent); }

    /* ===== 分类卡片 ===== */
    #content { min-height: 200px; }

    .category {
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      scroll-margin-top: 84px;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .category:hover { border-color: var(--border-strong); }

    .category-header {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 18px;
      background: transparent;
      border: 0;
      font: inherit;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background-color .15s ease;
    }
    .category-header:hover { background: var(--surface-hover); }
    .category-name { flex: 1; min-width: 0; font-family: var(--font-quote); font-size: 1.12rem; font-weight: 600; letter-spacing: .02em; }
    .category-count {
      flex: none;
      padding: 1px 8px;
      border-radius: 999px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--text-subtle);
      font-size: .7rem;
      font-variant-numeric: tabular-nums;
    }
    .chevron { flex: none; color: var(--text-subtle); transition: transform .2s ease, color .2s ease; }
    .category-header.open .chevron { transform: rotate(90deg); color: var(--accent); }

    .quotes { display: none; padding: 6px 10px 12px; border-top: 1px solid var(--border); }
    .quotes.open { display: block; animation: reveal .2s ease; }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }

    .quote-item {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: start;
      gap: 12px;
      padding: 12px;
      border-radius: 10px;
      transition: background-color .15s ease;
    }
    .quote-item:hover { background: var(--surface-hover); }

    .quote-number {
      margin-top: 4px;
      min-width: 30px;
      height: 24px;
      padding: 0 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text-muted);
      font-size: .7rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      transition: color .15s ease, background-color .15s ease, border-color .15s ease;
    }
    .quote-item:hover .quote-number { color: var(--accent-strong); border-color: var(--accent-line); background: var(--accent-soft); }

    .quote-text {
      font-family: var(--font-quote);
      font-size: 1.02rem;
      line-height: 1.9;
      color: var(--text);
      overflow-wrap: anywhere;
      text-wrap: pretty;
    }

    .quote-text blockquote {
      margin: 10px 0 2px;
      padding: 10px 16px;
      border-left: 3px solid var(--accent-line);
      border-radius: 4px 10px 10px 4px;
      background: var(--surface-soft);
      color: var(--text);
    }
    .quote-text blockquote p { margin: 0; }
    .quote-text blockquote p + p { margin-top: 8px; }

    /* Obsidian 风格 callout */
    .quote-text blockquote.callout {
      padding: 12px 16px 13px;
      border-left: 3px solid var(--callout-fg, #7ec8e3);
      border-radius: 4px 12px 12px 4px;
      background: var(--callout-bg, rgba(126, 200, 227, .13));
    }
    .callout-title {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
      font-family: var(--font-ui);
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .1em;
      color: var(--callout-fg);
    }
    .callout-icon { font-size: .95rem; line-height: 1; }

    .callout-note { --callout-fg: #7ec8e3; --callout-bg: rgba(126, 200, 227, .13); }
    .callout-tip { --callout-fg: #6dd3ac; --callout-bg: rgba(109, 211, 172, .13); }
    .callout-info { --callout-fg: #9ab8ff; --callout-bg: rgba(154, 184, 255, .13); }
    .callout-warning { --callout-fg: #e5b567; --callout-bg: rgba(229, 181, 103, .13); }
    .callout-danger { --callout-fg: #ff9b9b; --callout-bg: rgba(255, 155, 155, .13); }

    .quote-text strong, .quote-text b { color: var(--accent-strong); font-weight: 700; }
    .quote-text em, .quote-text i { color: var(--accent-strong); }
    .quote-text code {
      font-family: var(--font-mono);
      font-size: .88em;
      padding: 1px 5px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
    }
    .quote-text ul, .quote-text ol { margin: 8px 0; padding-left: 22px; }
    .quote-text li { margin: 4px 0; }
    .quote-text a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

    /* ===== 状态 / 页脚 ===== */
    .state { padding: 56px 16px; text-align: center; color: var(--text-muted); font-size: .92rem; }
    .state.loading::before {
      content: "";
      display: block;
      width: 24px; height: 24px;
      margin: 0 auto 12px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state.error { color: var(--danger); }
    .state-hint { margin-top: 10px; font-size: .82rem; color: var(--text-subtle); line-height: 1.7; }
    .state-hint code { font-family: var(--font-mono); padding: 1px 5px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface-soft); }

    .footer { margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--border); text-align: center; }
    .footer-quote { margin: 0 0 6px; font-family: var(--font-quote); font-size: .95rem; color: var(--text-muted); }
    .footer-meta { margin: 0; font-size: .78rem; color: var(--text-subtle); }
    .footer-meta a { color: var(--accent-strong); text-decoration: none; }
    .footer-meta a:hover { text-decoration: underline; }
    .footer-social { display: none; }
    .footer-meta code { font-family: var(--font-mono); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface-soft); }

    /* ===== 悬浮按钮 / 遮罩 ===== */
    .page-jump { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 45; }
    .page-jump button {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: color .15s ease, border-color .15s ease, transform .15s ease;
    }
    .page-jump button:hover { color: var(--accent-strong); border-color: var(--accent-line); transform: translateY(-2px); }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 55;
      background: rgba(8, 14, 23, .48);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }
    .overlay.open { display: block; }

    @media (min-width: 1600px) {
      .page { width: calc(100% - 364px); max-width: 1200px; margin: 0 0 0 16px; }
      .hero-body { padding-right: 0; }
      .hero-art {
        position: fixed;
        top: auto;
        bottom: 0;
        right: 16px;
        width: 340px;
      }
      .hero-art img { max-height: calc(100vh - 184px); object-fit: contain; object-position: bottom right; }
      .page-jump { top: 72px; bottom: auto; }
    }

    @media (max-width: 880px) {
      .sidebar { transform: translateX(-100%); box-shadow: var(--shadow-lg); z-index: 70; }
      .sidebar.open { transform: none; }
      .main { margin-left: 0; }
      .menu-btn { display: grid; }
      .topbar-title { display: block; white-space: nowrap; }
      .hero { padding: 14px 0 16px; }
      .quote-item { padding: 10px 6px; gap: 10px; }
      .quotes { padding: 4px 6px 10px; }
      .page-jump { right: 14px; bottom: 14px; }
      .page-jump button { width: 38px; height: 38px; }
    }

    @media (max-width: 560px) {
      .topbar-actions .chip { display: none; }
      .footer-social { display: inline; }
      .hero-body { padding-right: 0; }
      .hero-kicker, .hero h1, .hero-sub { padding-right: 80px; }
      .hero-art { width: 68px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" id="jump-bottom" title="回到底部" aria-label="回到底部">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <noscript><p style="padding:16px;text-align:center;">需要启用 JavaScript 才能加载语录。</p></noscript>


  <script>
    (function () {
      'use strict';

      var CONFIG = { textFile: '心灵鸡汤.md' };

      var CALLOUT_META = {
        note: { icon: '📝', label: '笔记' },
        tip: { icon: '💡', label: '提示' },
        info: { icon: 'ℹ️', label: '说明' },
        warning: { icon: '⚠️', label: '注意' },
        danger: { icon: '🚨', label: '警告' },
        success: { icon: '✅', label: '完成' },
        question: { icon: '❓', label: '疑问' },
        quote: { icon: '💬', label: '引用' },
        important: { icon: '❗', label: '重要' },
        abstract: { icon: '📋', label: '摘要' },
        todo: { icon: '✔️', label: '待办' },
        example: { icon: '🧪', label: '示例' }
      };

      var CHEVRON = '<svg class="chevron" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">' +
        '<path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      var categories = [];
      var scrollTicking = false;

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function stripLeadingText(node, count) {
        var remaining = count;
        while (remaining > 0 && node.firstChild) {
          var child = node.firstChild;
          if (child.nodeType !== 3) break;
          var length = child.textContent.length;
          if (length <= remaining) {
            remaining -= length;
            node.removeChild(child);
          } else {
            child.textContent = child.textContent.slice(remaining);
            remaining = 0;
          }
        }
      }

      // 把 Obsidian 的 > [!note] 语法渲染成真正的 callout 卡片
      function enhanceCallouts(html) {
        if (html.indexOf('[!') === -1) return html;

        var template = document.createElement('template');
        template.innerHTML = html;
        var quotes = template.content.querySelectorAll('blockquote');

        for (var i = 0; i < quotes.length; i++) {
          var quote = quotes[i];
          var first = quote.firstElementChild;
          if (!first || first.tagName !== 'P') continue;

          var match = (first.textContent || '').match(/^\s*\[!([A-Za-z]+)\][+-]?\s*/);
          if (!match) continue;

          var type = match[1].toLowerCase();
          var meta = CALLOUT_META[type];

          stripLeadingText(first, match[0].length);
          while (first.firstChild && (first.firstChild.nodeName === 'BR' ||
            (first.firstChild.nodeType === 3 && !first.firstChild.textContent.trim()))) {
            first.removeChild(first.firstChild);
          }

          quote.classList.add('callout');
          quote.classList.add(meta ? 'callout-' + type : 'callout-note');

          var title = document.createElement('div');
          title.className = 'callout-title';
          title.innerHTML = '<span class="callout-icon" aria-hidden="true">' +
            (meta ? meta.icon : '📌') + '</span><span>' +
            escapeHtml(meta ? meta.label : type) + '</span>';
          quote.insertBefore(title, quote.firstChild);
        }

        return template.innerHTML;
      }

      function renderMarkdown(md) {
        var raw = String(md || '');
        if (typeof window.marked === 'undefined' || !window.marked) {
          return escapeHtml(raw).replace(/\r?\n/g, '<br>');
        }
        return enhanceCallouts(String(window.marked.parse(raw)).trim());
      }

      // 列表项下的续行通常缩进 1-4 格，去掉后 > 引用块才能正确解析
      function normalizeIndent(md) {
        var lines = String(md || '').split('\n');
        for (var i = 1; i < lines.length; i++) {
          lines[i] = lines[i].replace(/^[ \t]{1,4}/, '');
        }
        return lines.join('\n');
      }

      function renderCategory(name, quotes, id) {
        var items = '';
        for (var i = 0; i < quotes.length; i++) {
          items += '<div class="quote-item">' +
            '<span class="quote-number" aria-hidden="true">' + escapeHtml(quotes[i].num) + '</span>' +
            '<div class="quote-text">' + renderMarkdown(quotes[i].body) + '</div>' +
            '</div>';
        }
        return '<section class="category" id="section-' + id + '">' +
          '<button type="button" class="category-header" id="title-' + id + '" aria-expanded="false" aria-controls="' + id + '" onclick="toggleCategory(\'' + id + '\')">' +
          '<span class="category-name">' + escapeHtml(name) + '</span>' +
          '<span class="category-count">' + quotes.length + '</span>' +
          CHEVRON +
          '</button>' +
          '<div class="quotes" id="' + id + '">' + items + '</div>' +
          '</section>';
      }

      function parseContent(text) {
        var lines = String(text || '').split(/\r?\n/);
        var html = '';
        var current = null;
        var catIndex = 0;
        var quoteTotal = 0;
        categories = [];

        function flush() {
          if (!current || current.quotes.length === 0) { current = null; return; }
          var id = 'category-' + catIndex;
          html += renderCategory(current.name, current.quotes, id);
          categories.push({ id: id, name: current.name, count: current.quotes.length });
          catIndex += 1;
          current = null;
        }

        for (var i = 0; i < lines.length; i++) {
          var trimmed = lines[i].trim();
          if (!trimmed) continue;

          if (/^#{1,2}\s/.test(trimmed)) {
            flush();
            current = { name: trimmed.replace(/^#{1,2}\s*/, ''), quotes: [] };
            continue;
          }
          if (/^---+$/.test(trimmed)) continue;

          var match = trimmed.match(/^(\d+)\.\s*(.*)$/);
          if (!match || !current) continue;

          var body = match[2] || '';
          var j = i + 1;
          while (j < lines.length) {
            var nextLine = lines[j];
            var nextTrim = nextLine.trim();
            if (!nextTrim || /^---+$/.test(nextTrim)) { body += '\n'; j += 1; continue; }
            if (/^#{1,2}\s/.test(nextTrim) || /^(\d+)\.\s*/.test(nextTrim)) break;
            body += '\n' + nextLine;
            j += 1;
          }

          body = normalizeIndent(body);
          if (body.replace(/\s/g, '') !== '') {
            current.quotes.push({ num: match[1], body: body });
            quoteTotal += 1;
          }
          i = j - 1;
        }
        flush();

        var stats = document.getElementById('stats');
        if (stats) {
          stats.innerHTML = '<span class="stat"><strong>' + categories.length + '</strong> 个分类</span>' +
            '<span class="stat-dot" aria-hidden="true"></span>' +
            '<span class="stat"><strong>' + quoteTotal + '</strong> 条语录</span>';
        }
        return html;
      }

      function renderToc() {
        var toc = document.getElementById('toc');
        if (!toc) return;
        if (categories.length === 0) {
          toc.innerHTML = '<p class="toc-empty">暂无目录</p>';
          return;
        }
        var html = '';
        for (var i = 0; i < categories.length; i++) {
          var cat = categories[i];
          html += '<a class="toc-item" id="toc-' + cat.id + '" href="#section-' + cat.id + '"' +
            ' onclick="jumpToCategory(\'' + cat.id + '\'); return false;">' +
            '<span class="toc-name">' + escapeHtml(cat.name) + '</span>' +
            '<span class="toc-count">' + cat.count + '</span></a>';
        }
        toc.innerHTML = html;
      }

      function setActiveToc(id) {
        var items = document.querySelectorAll('.toc-item');
        for (var i = 0; i < items.length; i++) {
          var isActive = !!id && items[i].id === 'toc-' + id;
          items[i].classList.toggle('active', isActive);
          if (isActive) items[i].setAttribute('aria-current', 'true');
          else items[i].removeAttribute('aria-current');
        }
      }

      function updateActiveToc() {
        if (!categories.length) return;
        var threshold = 130;
        var activeId = null;
        for (var i = 0; i < categories.length; i++) {
          var section = document.getElementById('section-' + categories[i].id);
          if (!section) continue;
          if (section.getBoundingClientRect().top <= threshold) activeId = categories[i].id;
          else break;
        }
        setActiveToc(activeId);
      }

      function onScroll() {
        if (scrollTicking) return;
        scrollTicking = true;
        window.requestAnimationFrame(function () {
          scrollTicking = false;
          updateActiveToc();
        });
      }

      function setExpanded(id, open) {
        var panel = document.getElementById(id);
        var header = document.getElementById('title-' + id);
        if (!panel || !header) return;
        panel.classList.toggle('open', !!open);
        header.classList.toggle('open', !!open);
        header.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      function closeSidebar() {
        var sidebar = document.getElementById('sidebar');
        var overlay = document.getElementById('overlay');
        var menu = document.getElementById('menu-btn');
        if (sidebar) sidebar.classList.remove('open');
        if (overlay) overlay.classList.remove('open');
        if (menu) menu.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('no-scroll');
      }

      window.toggleSidebar = function () {
        var sidebar = document.getElementById('sidebar');
        var overlay = document.getElementById('overlay');
        var menu = document.getElementById('menu-btn');
        if (!sidebar) return;
        var open = !sidebar.classList.contains('open');
        sidebar.classList.toggle('open', open);
        if (overlay) overlay.classList.toggle('open', open);
        if (menu) menu.setAttribute('aria-expanded', open ? 'true' : 'false');
        document.body.classList.toggle('no-scroll', open);
      };

      window.toggleCategory = function (id) {
        var header = document.getElementById('title-' + id);
        if (!header) return;
        setExpanded(id, !header.classList.contains('open'));
      };

      window.jumpToCategory = function (id) {
        setExpanded(id, true);
        var section = document.getElementById('section-' + id);
        if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        setActiveToc(id);
        if (window.matchMedia('(max-width: 880px)').matches) closeSidebar();
        return false;
      };

      window.expandAll = function () {
        for (var i = 0; i < categories.length; i++) setExpanded(categories[i].id, true);
      };

      window.collapseAll = function () {
        for (var i = 0; i < categories.length; i++) setExpanded(categories[i].id, false);
      };

      async function loadContent() {
        var content = document.getElementById('content');
        if (!content) return;
        content.innerHTML = '<div class="state loading">正在加载语录…</div>';
        try {
          if (window.location.protocol === 'file:') {
            throw new Error('请双击项目里的「打开网页.cmd」读取最新语录，或访问 GitHub Pages 网页');
          }
          var response = await fetch(encodeURI(CONFIG.textFile), { cache: 'no-store' });
          if (!response.ok) throw new Error('语录文件加载失败（HTTP ' + response.status + '）');
          var text = await response.text();
          var html = parseContent(text);
          if (!html.trim()) throw new Error('文件内容为空或格式不正确');
          content.innerHTML = html;
          renderToc();
          if (categories.length) setExpanded(categories[0].id, true);
          updateActiveToc();
        } catch (error) {
          content.innerHTML = '<div class="state error">' +
            '<p>😢 ' + escapeHtml(error && error.message ? error.message : '加载失败') + '</p>' +
            '<p class="state-hint">本地请双击 <code>打开网页.cmd</code>（需安装 Python 3）；在线请确认 <code>心灵鸡汤.md</code> 已提交到 Pages 发布分支并完成部署，然后刷新重试。</p>' +
            '</div>';
        }
      }

      function bind() {
        var jumpTop = document.getElementById('jump-top');
        if (jumpTop) jumpTop.addEventListener('click', function () {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        var jumpBottom = document.getElementById('jump-bottom');
        if (jumpBottom) jumpBottom.addEventListener('click', function () {
          window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
        });

        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') closeSidebar();
        });

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);

        loadContent();
      }

      document.addEventListener('DOMContentLoaded', bind);
    })();
  </script>
</body>
</html>
